{{ define "main" }}
<article>
<h1>{{ .Title }}</h1>
{{ if eq .Section "posts" }}
<p class="meta">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
  {{- with .GetTerms "tags" }} · {{ range $i, $t := . }}{{ if $i }}, {{ end }}<a href="{{ $t.RelPermalink }}">{{ $t.LinkTitle }}</a>{{ end }}{{ end }}
</p>
{{ end }}
{{ .Content }}
</article>
{{ end }}
