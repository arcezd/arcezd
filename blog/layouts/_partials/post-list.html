{{- /* Posts grouped by year, one line each: "Mon DD  Title". Expects a page collection. */ -}}
{{ range .GroupByDate "2006" }}
<h2 class="year">{{ .Key }}</h2>
<ul class="posts">
{{- range .Pages }}
  <li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
{{- end }}
</ul>
{{ end }}
